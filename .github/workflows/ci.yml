name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, sv check, test, Poetics checks, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the Poetics change check compares with the base branch
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: sv check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Validate .poetics store
        run: pnpm validate

      - name: Check GOTCHAS.md is generated from notes
        run: pnpm gotchas --check

      - name: Poetics change check
        if: github.event_name == 'pull_request'
        run: pnpm poetics:check --since "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Poetics coverage
        run: pnpm poetics:coverage

      - name: Build
        run: pnpm build

  changeset:
    name: Changeset status
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informational: not every change needs a release, so this never fails the build.
      - name: Report changesets
        run: pnpm changeset status --since origin/${{ github.base_ref }} || echo "::notice::No changeset found. Add one with 'pnpm changeset' if a package's behaviour changed."
